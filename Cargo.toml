[package]
name = "tdsr-server"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/tspivey/tdsr-server"
rust-version = "1.85.1"

[dependencies]
native-dialog = "0.9.4"
tao = { version = "0.34.5", default-features = false }
tray-icon = { version = "0.21.2", default-features = false }
tts = { version = "0.26.3", features = ["tolk"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
